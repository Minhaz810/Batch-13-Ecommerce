{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Habijabi - Premium E-Commerce Store{% endblock %}</title>
  <meta name="description" content="Discover premium products and collections on Habijabi.">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'navbar.html' %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div style="display: flex; align-items: center; gap: 0.6rem;">
        <span style="font-family: var(--font-heading); font-weight: 800; font-size: 1.1rem; color: var(--text-primary);">Habijabi</span>
        <span>&copy; 2026. All rights reserved.</span>
      </div>
      <div style="display: flex; gap: 1.25rem;">
        <a href="{% url 'products:product_list' %}" style="color: var(--text-secondary);">Products</a>
        <a href="/admin/" style="color: var(--text-secondary);">Admin Panel</a>
      </div>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
