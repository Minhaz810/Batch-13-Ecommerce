<header class="navbar-container">
  <div class="navbar">
    <!-- Brand Logo on Left -->
    <a href="{% url 'products:product_list' %}" class="brand-logo" id="brand-logo">
      <div class="logo-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <span class="brand-name">Habijabi</span>
      <span class="brand-badge">Shop</span>
    </a>

    <!-- Search Bar -->
    <form action="{% url 'products:product_list' %}" method="GET" class="search-form" id="search-form">
      {% if selected_category %}
        <input type="hidden" name="category" value="{{ selected_category.slug }}">
      {% endif %}
      <div class="search-input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input 
          type="text" 
          name="q" 
          value="{{ query|default:'' }}" 
          class="search-input" 
          placeholder="Search product name, category..." 
          autocomplete="off"
          id="product-search-input"
        >
        {% if query %}
          <a href="{% url 'products:product_list' %}{% if selected_category %}?category={{ selected_category.slug }}{% endif %}" class="search-clear-btn" title="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </a>
        {% endif %}
      </div>
    </form>

    <!-- Nav Actions -->
    <div class="nav-actions">
      <a href="{% url 'products:product_list' %}" class="nav-link-btn" id="nav-explore">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="7" x="3" y="3" rx="1"/>
          <rect width="7" height="7" x="14" y="3" rx="1"/>
          <rect width="7" height="7" x="14" y="14" rx="1"/>
          <rect width="7" height="7" x="3" y="14" rx="1"/>
        </svg>
        <span>Products</span>
      </a>

      <!-- Cart Button -->
      <a href="" class="nav-cart-btn" id="nav-cart" title="Shopping Cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/>
          <circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
      </a>

      <a href="/admin/" class="nav-link-btn" id="nav-admin" title="Django Admin">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Admin</span>
      </a>
    </div>
  </div>
</header>
